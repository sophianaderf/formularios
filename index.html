<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <h1>Formulário de Cadastro</h1>

    <form>
        <div class="container">
            <fieldset>

                 <legend>Dados do Estudante</legend>
                 
                 <div>
                    <label>Primeiro Nome:</label>
                    <input type="text"> 
                 </div>

                 <div>
                    <label>Último Nome:</label>
                    <input type="text">
                 </div>

                  <div>
                    <label>E-mail:</label>
                    <input type="email">
                </div>


                 <div>
                    <label>Telefone:</label>
                    <input type="tel">
                 </div>

                 <div>
                    <label>WhatsApp:</label>
                    <input type="checkbox" class="checkbox">
                 </div>

                 <div>
                    <label>Idade:</label>
                    <input type="number" min="10" max="120">
                 </div>

            </fieldset>

            <fieldset>
                <legend>Dados do Responsável:</legend>

                <div>
                    <label>Primeiro Nome:</label>
                    <input type="text">
                </div>

                <div>
                    <label>Último Nome:</label>
                    <input type="text">
                </div>

                <div>
                    <label>E-mail:</label>
                    <input type="email">
                </div>

                <div>
                    <label>Telefone:</label>
                    <input type="tel">
                </div>

                <div>
                    <label>WhatsApp:</label>
                    <input type="checkbox" class="checkbox">
                </div>

                <div>
                    <label>Parentesco:</label>
                    <select>
                        <option>--Selecione--</option>
                        <option>Pai</option>
                        <option>Mãe</option>
                        <option>Responsável</option>
                    </select>
                </div>

            </fieldset>

        </div>

        <div class="container">
            <fieldset>
                <legend>Dados do Endereço</legend>

                <div>
                    <label>CEP:</label>
                    <input onkeydown="buscar(event)" id="cep" type="text" placeholder="Digite e aperte Enter para buscar">
                </div>

                <div>
                    <label>Logradouro:</label>
                    <input id="logradouro" type="text">
                </div>

                <div>
                    <label>Número: </label>
                    <input type="number">
                </div>

                <div>
                    <label>Bairro:</label>
                    <input id="bairro" type="text">
                </div>


                <div>
                    <label>Cidade:</label>
                    <input type="text">
                </div>

                <div>
                    <label>Estado:</label>
                    <input id="estado" type="text">
                </div>

                <div>
                    <label>UF:</label>
                    <input id="uf" type="text">
                </div>
            </fieldset>

            <fieldset>
                <legend>Dados do Curso</legend>

                <div>
                    <label>Nome:</label>
                    <input type="text">
                </div>

                <div>
                    <label>Período:</label>
                    <select>
                        <option>--Selecione--</option>
                        <option>Manhã</option>
                        <option>Tarde</option>
                        <option>Integral</option>
                    </select>
                </div>

                <div>
                    <label>Turno:</label>
                    <select>
                        <option>--Selecione--</option>
                        <option>Técnico</option>
                        <option>Aprendizagem</option>
                        <option>FIC</option>
                    </select>
                </div>

                <div>
                    <label>Modalidade:</label>
                    <select>
                        <option>--Selecione--</option>
                        <option>Presencial</option>
                        <option>Semi-presencial</option>
                        <option>EAD</option>
                    </select>
                </div>

                <div>
                    <label>Observações:</label>
                    <textarea rows="4" cols="40"></textarea>
                </div>

            </fieldset>
        </div>

        <div class="container botoes">
            <button type="submit" onclick="cadastrar(event)">Cadastrar informações</button>
            <button type="reset">Limpar formulário</button>
        </div>

    </form>
</body>
<script src="index.js"></script>    
</html>
